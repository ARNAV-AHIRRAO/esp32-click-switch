<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010"><rect width="1400" height="1010" fill="#ffffff"/><text x="700.0" y="52" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="34" fill="#1f2933" text-anchor="middle" font-weight="bold">Gesture Alt+Tab: How To Use It</text><text x="700.0" y="86" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#52606d" text-anchor="middle" font-weight="normal">Hold your hand up to the webcam, palm facing the camera, fingers pointing up.</text><rect x="40" y="110" width="420" height="560" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="4"/><rect x="40" y="110" width="420" height="62" rx="16" fill="#94a3b8" stroke="#94a3b8" stroke-width="4"/><rect x="40" y="140" width="420" height="32" rx="0" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><text x="250.0" y="152" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">1. NOTHING</text><rect x="136.0" y="306" width="188" height="130" rx="26" fill="#e8eef5" stroke="#1f2933" stroke-width="3"/><rect x="142.0" y="286" width="38" height="40" rx="18" fill="#94a3b8" stroke="#1f2933" stroke-width="3"/><rect x="188.0" y="286" width="38" height="40" rx="18" fill="#94a3b8" stroke="#1f2933" stroke-width="3"/><rect x="234.0" y="286" width="38" height="40" rx="18" fill="#94a3b8" stroke="#1f2933" stroke-width="3"/><rect x="280.0" y="286" width="38" height="40" rx="18" fill="#94a3b8" stroke="#1f2933" stroke-width="3"/><g transform="rotate(35 324.0 366)"><rect x="322.0" y="326" width="40" height="78" rx="18" fill="#e8eef5" stroke="#1f2933" stroke-width="3"/></g><text x="376.0" y="424" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" text-anchor="start" font-weight="normal">thumb</text><text x="376.0" y="442" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" text-anchor="start" font-weight="normal">ignored</text><text x="250.0" y="478" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#1f2933" text-anchor="middle" font-weight="bold">0 or 1 finger, or a fist</text><text x="250.0" y="512" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="normal">No action. Use this to rest your hand.</text><text x="250.0" y="538" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="normal">If Alt+Tab is open, it stays open.</text><rect x="60" y="610" width="380" height="44" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="250.0" y="639" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">Waiting</text><rect x="490" y="110" width="420" height="560" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="4"/><rect x="490" y="110" width="420" height="62" rx="16" fill="#d97706" stroke="#d97706" stroke-width="4"/><rect x="490" y="140" width="420" height="32" rx="0" fill="#d97706" stroke="#d97706" stroke-width="0"/><text x="700.0" y="152" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">2. NEXT WINDOW</text><rect x="586.0" y="306" width="188" height="130" rx="26" fill="#e8eef5" stroke="#1f2933" stroke-width="3"/><rect x="592.0" y="286" width="38" height="40" rx="18" fill="#94a3b8" stroke="#1f2933" stroke-width="3"/><rect x="638.0" y="286" width="38" height="40" rx="18" fill="#94a3b8" stroke="#1f2933" stroke-width="3"/><rect x="684.0" y="188" width="38" height="138" rx="18" fill="#16a34a" stroke="#1f2933" stroke-width="3"/><rect x="730.0" y="202" width="38" height="124" rx="18" fill="#16a34a" stroke="#1f2933" stroke-width="3"/><g transform="rotate(35 774.0 366)"><rect x="772.0" y="326" width="40" height="78" rx="18" fill="#e8eef5" stroke="#1f2933" stroke-width="3"/></g><text x="826.0" y="424" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" text-anchor="start" font-weight="normal">thumb</text><text x="826.0" y="442" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" text-anchor="start" font-weight="normal">ignored</text><text x="700.0" y="478" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#1f2933" text-anchor="middle" font-weight="bold">Show exactly 2 fingers</text><text x="700.0" y="512" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="normal">First time: opens Alt+Tab.</text><text x="700.0" y="538" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="normal">Again later: moves to the next window.</text><rect x="510" y="610" width="380" height="44" rx="10" fill="#f1f5f9" stroke="#d97706" stroke-width="2"/><text x="700.0" y="639" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">Alt held + Tab pressed</text><rect x="940" y="110" width="420" height="560" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="4"/><rect x="940" y="110" width="420" height="62" rx="16" fill="#16a34a" stroke="#16a34a" stroke-width="4"/><rect x="940" y="140" width="420" height="32" rx="0" fill="#16a34a" stroke="#16a34a" stroke-width="0"/><text x="1150.0" y="152" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">3. SELECT</text><rect x="1036.0" y="306" width="188" height="130" rx="26" fill="#e8eef5" stroke="#1f2933" stroke-width="3"/><rect x="1042.0" y="286" width="38" height="40" rx="18" fill="#94a3b8" stroke="#1f2933" stroke-width="3"/><rect x="1088.0" y="202" width="38" height="124" rx="18" fill="#16a34a" stroke="#1f2933" stroke-width="3"/><rect x="1134.0" y="188" width="38" height="138" rx="18" fill="#16a34a" stroke="#1f2933" stroke-width="3"/><rect x="1180.0" y="202" width="38" height="124" rx="18" fill="#16a34a" stroke="#1f2933" stroke-width="3"/><g transform="rotate(35 1224.0 366)"><rect x="1222.0" y="326" width="40" height="78" rx="18" fill="#e8eef5" stroke="#1f2933" stroke-width="3"/></g><text x="1276.0" y="424" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" text-anchor="start" font-weight="normal">thumb</text><text x="1276.0" y="442" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" text-anchor="start" font-weight="normal">ignored</text><text x="1150.0" y="478" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#1f2933" text-anchor="middle" font-weight="bold">Show 3 or 4 fingers</text><text x="1150.0" y="512" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="normal">Lets go of Alt.</text><text x="1150.0" y="538" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="normal">Windows picks the highlighted window.</text><rect x="960" y="610" width="380" height="44" rx="10" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/><text x="1150.0" y="639" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">Alt released</text><line x1="462" y1="390" x2="488" y2="390" stroke="#7b8794" stroke-width="4" stroke-linecap="round"/><polygon points="488,390 476.3,395.7 476.3,384.3" fill="#7b8794"/><line x1="912" y1="390" x2="938" y2="390" stroke="#7b8794" stroke-width="4" stroke-linecap="round"/><polygon points="938,390 926.3,395.7 926.3,384.3" fill="#7b8794"/><rect x="40" y="690" width="1320" height="90" rx="12" fill="#fff8e8" stroke="#e6c27a" stroke-width="2"/><text x="60" y="722" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="start" font-weight="bold">TO GO 2 WINDOWS BACK</text><text x="60" y="752" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#1f2933" text-anchor="start" font-weight="normal">Show 2 fingers  >  drop your hand or make a fist  >  show 2 fingers again  >  show 3 fingers.</text><text x="60" y="774" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#52606d" text-anchor="start" font-weight="normal">The gesture counts once per raise, so lower your hand between each step.</text><text x="40" y="830" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#1f2933" text-anchor="start" font-weight="bold">WHAT HAPPENS INSIDE</text><rect x="40" y="850" width="230" height="120" rx="10" fill="#eef3f8" stroke="#1f2933" stroke-width="3"/><text x="155.0" y="884" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">WEBCAM</text><text x="155.0" y="914" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">live camera pictures,</text><text x="155.0" y="937" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#52606d" text-anchor="middle" font-weight="normal">not saved or uploaded</text><line x1="274" y1="910" x2="308" y2="910" stroke="#1f2933" stroke-width="4" stroke-linecap="round"/><polygon points="308,910 296.3,915.7 296.3,904.3" fill="#1f2933"/><rect x="312" y="850" width="230" height="120" rx="10" fill="#eef3f8" stroke="#1f2933" stroke-width="3"/><text x="427.0" y="884" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">MEDIAPIPE</text><text x="427.0" y="914" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">finds 21 points</text><text x="427.0" y="937" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#52606d" text-anchor="middle" font-weight="normal">on your hand</text><line x1="546" y1="910" x2="580" y2="910" stroke="#1f2933" stroke-width="4" stroke-linecap="round"/><polygon points="580,910 568.3,915.7 568.3,904.3" fill="#1f2933"/><rect x="584" y="850" width="230" height="120" rx="10" fill="#eef3f8" stroke="#1f2933" stroke-width="3"/><text x="699.0" y="884" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">FINGER COUNT</text><text x="699.0" y="914" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">fingertip above its</text><text x="699.0" y="937" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#52606d" text-anchor="middle" font-weight="normal">middle joint = up</text><line x1="818" y1="910" x2="852" y2="910" stroke="#1f2933" stroke-width="4" stroke-linecap="round"/><polygon points="852,910 840.3,915.7 840.3,904.3" fill="#1f2933"/><rect x="856" y="850" width="230" height="120" rx="10" fill="#eef3f8" stroke="#1f2933" stroke-width="3"/><text x="971.0" y="884" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">KEY PRESSES</text><text x="971.0" y="914" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">Alt down, Tab,</text><text x="971.0" y="937" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#52606d" text-anchor="middle" font-weight="normal">Alt up (pyautogui)</text><line x1="1090" y1="910" x2="1124" y2="910" stroke="#1f2933" stroke-width="4" stroke-linecap="round"/><polygon points="1124,910 1112.3,915.7 1112.3,904.3" fill="#1f2933"/><rect x="1128" y="850" width="230" height="120" rx="10" fill="#eef3f8" stroke="#1f2933" stroke-width="3"/><text x="1243.0" y="884" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">WINDOWS</text><text x="1243.0" y="914" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">switches to the</text><text x="1243.0" y="937" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#52606d" text-anchor="middle" font-weight="normal">window you picked</text></svg>