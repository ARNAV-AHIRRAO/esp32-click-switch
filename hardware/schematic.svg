<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="880" viewBox="0 0 1480 880"><rect width="1480" height="880" fill="#ffffff"/><text x="740.0" y="48" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="32" fill="#1f2933" text-anchor="middle" font-weight="bold">ESP32 Click Switch: Electrical Schematic</text><text x="740.0" y="80" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#52606d" text-anchor="middle" font-weight="normal">One push button between GPIO4 and GND. No external resistor needed.</text><rect x="80" y="130" width="360" height="440" rx="10" fill="#eef3f8" stroke="#1f2933" stroke-width="3"/><text x="260" y="166" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#1f2933" text-anchor="middle" font-weight="bold">ESP32 DevKit V1</text><text x="428" y="231" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="end" font-weight="bold">3V3</text><circle cx="440" cy="240" r="7" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text x="428" y="371" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="end" font-weight="bold">GPIO4</text><circle cx="440" cy="380" r="7" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text x="428" y="511" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="end" font-weight="bold">GND</text><circle cx="440" cy="520" r="7" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><rect x="108" y="200" width="232" height="185" rx="8" fill="none" stroke="#7b8794" stroke-width="2" stroke-dasharray="8 6"/><polyline points="300,240 300,282 288,292 312,304 288,316 312,328 300,338 300,380" fill="none" stroke="#1565c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="300,240 433,240" fill="none" stroke="#1565c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="300,380 433,380" fill="none" stroke="#1565c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="300" cy="380" r="5" fill="#1565c0" stroke="none" stroke-width="1"/><text x="120" y="226" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#52606d" text-anchor="start" font-weight="normal">inside the ESP32</text><text x="120" y="268" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1565c0" text-anchor="start" font-weight="bold">internal</text><text x="120" y="291" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1565c0" text-anchor="start" font-weight="bold">pull-up</text><text x="120" y="314" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1565c0" text-anchor="start" font-weight="bold">resistor</text><text x="120" y="340" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1565c0" text-anchor="start" font-weight="normal">about 45 k&#937;</text><text x="260" y="416" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#52606d" text-anchor="middle" font-weight="normal">switched on by this code line:</text><text x="260" y="438" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">pinMode(PIN, INPUT_PULLUP)</text><text x="260" y="478" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">digitalRead(GPIO4)</text><text x="255" y="504" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">HIGH = idle   LOW = pressed</text><text x="260" y="548" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#52606d" text-anchor="middle" font-weight="normal">Firmware: click_switch.ino</text><polyline points="440,380 780,380 780,430" fill="none" stroke="#e07b00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="780" cy="430" r="6" fill="#1f2933" stroke="none" stroke-width="1"/><line x1="780" y1="430" x2="748" y2="492" stroke="#1f2933" stroke-width="4" stroke-linecap="round"/><circle cx="780" cy="510" r="6" fill="#1f2933" stroke="none" stroke-width="1"/><polyline points="780,510 780,520 440,520" fill="none" stroke="#111111" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="500" cy="520" r="6" fill="#111111" stroke="none" stroke-width="1"/><line x1="500" y1="520" x2="500" y2="548" stroke="#111111" stroke-width="4" stroke-linecap="round"/><line x1="478" y1="548" x2="522" y2="548" stroke="#111111" stroke-width="4" stroke-linecap="round"/><line x1="487" y1="559" x2="513" y2="559" stroke="#111111" stroke-width="4" stroke-linecap="round"/><line x1="495" y1="570" x2="505" y2="570" stroke="#111111" stroke-width="4" stroke-linecap="round"/><text x="500" y="600" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#111111" text-anchor="middle" font-weight="bold">GND</text><text x="610" y="362" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#e07b00" text-anchor="middle" font-weight="bold">D4 wire (orange): B4 to A58</text><text x="690" y="552" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#111111" text-anchor="middle" font-weight="bold">GND wire (black): B1 to J60</text><text x="800" y="456" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#1f2933" text-anchor="start" font-weight="bold">SW1</text><text x="800" y="480" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">push button</text><text x="800" y="502" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">E58 to F60</text><text x="800" y="524" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#52606d" text-anchor="start" font-weight="normal">(diagonal legs)</text><text x="796" y="408" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#52606d" text-anchor="start" font-weight="normal">press = closes</text><text x="940" y="130" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#1f2933" text-anchor="start" font-weight="bold">WHAT THE ESP32 SEES</text><rect x="930" y="144" width="470" height="36" rx="0" fill="#e4e7eb" stroke="none" stroke-width="1"/><text x="940" y="169" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="bold">State</text><text x="1040" y="169" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="bold">Switch</text><text x="1130" y="169" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="bold">GPIO4 pin</text><text x="1280" y="169" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="bold">digitalRead</text><line x1="930" y1="220" x2="1400" y2="220" stroke="#cbd2d9" stroke-width="1" stroke-linecap="round"/><text x="940" y="208" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">Idle</text><text x="1040" y="208" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">open</text><text x="1130" y="208" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">3.3 V (pull-up)</text><text x="1280" y="208" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">HIGH</text><line x1="930" y1="256" x2="1400" y2="256" stroke="#cbd2d9" stroke-width="1" stroke-linecap="round"/><text x="940" y="244" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">Pressed</text><text x="1040" y="244" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">closed</text><text x="1130" y="244" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">0 V (to GND)</text><text x="1280" y="244" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">LOW</text><text x="940" y="290" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#1f2933" text-anchor="start" font-weight="bold">BILL OF MATERIALS</text><rect x="930" y="304" width="470" height="180" rx="8" fill="#f7f9fb" stroke="#cbd2d9" stroke-width="2"/><text x="946" y="332" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="bold">1 x</text><text x="996" y="332" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">ESP32 DevKit V1 (30 pin, micro-USB)</text><text x="946" y="366" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="bold">1 x</text><text x="996" y="366" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">Breadboard (any size)</text><text x="946" y="400" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="bold">1 x</text><text x="996" y="400" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">Push button, 4 legs (6 mm tactile)</text><text x="946" y="434" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="bold">2 x</text><text x="996" y="434" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">Male-to-male jumper wires</text><text x="946" y="468" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="bold">1 x</text><text x="996" y="468" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="normal">Micro-USB DATA cable (not charge-only)</text><text x="940" y="540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#1f2933" text-anchor="start" font-weight="bold">PIN MAP</text><text x="940" y="576" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">ESP32 pin</text><text x="1060" y="576" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">Breadboard</text><text x="1230" y="576" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">Goes to</text><text x="940" y="608" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="normal">D4 = GPIO4</text><text x="1060" y="608" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="normal">row 4, wire at B4</text><text x="1230" y="608" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="normal">A58, button leg E58</text><text x="940" y="640" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="normal">GND</text><text x="1060" y="640" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="normal">row 1, wire at B1</text><text x="1230" y="640" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="normal">J60, button leg F60</text><text x="940" y="672" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="normal">USB</text><text x="1060" y="672" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="normal">-</text><text x="1230" y="672" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="normal">Laptop (data + power)</text><line x1="930" y1="584" x2="1400" y2="584" stroke="#cbd2d9" stroke-width="1" stroke-linecap="round"/><text x="80" y="690" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#1f2933" text-anchor="start" font-weight="bold">SIGNAL FLOW</text><rect x="80" y="710" width="250" height="130" rx="10" fill="#eef3f8" stroke="#1f2933" stroke-width="3"/><text x="205.0" y="746" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">PUSH BUTTON</text><text x="205.0" y="778" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">closes the circuit</text><text x="205.0" y="802" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#52606d" text-anchor="middle" font-weight="normal">D4 to GND</text><line x1="336" y1="775" x2="434" y2="775" stroke="#1f2933" stroke-width="4" stroke-linecap="round"/><polygon points="434,775 423.2,780.2 423.2,769.8" fill="#1f2933"/><text x="385.0" y="756" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" text-anchor="middle" font-weight="normal">GPIO4</text><text x="385.0" y="802" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" text-anchor="middle" font-weight="normal">HIGH / LOW</text><rect x="440" y="710" width="250" height="130" rx="10" fill="#eef3f8" stroke="#1f2933" stroke-width="3"/><text x="565.0" y="746" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">ESP32 FIRMWARE</text><text x="565.0" y="778" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">debounce, count clicks,</text><text x="565.0" y="802" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#52606d" text-anchor="middle" font-weight="normal">detect hold</text><line x1="696" y1="775" x2="794" y2="775" stroke="#1f2933" stroke-width="4" stroke-linecap="round"/><polygon points="794,775 783.2,780.2 783.2,769.8" fill="#1f2933"/><text x="745.0" y="756" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" text-anchor="middle" font-weight="normal">USB serial</text><text x="745.0" y="802" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" text-anchor="middle" font-weight="normal">"1" "2" "H" "R"</text><rect x="800" y="710" width="250" height="130" rx="10" fill="#eef3f8" stroke="#1f2933" stroke-width="3"/><text x="925.0" y="746" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">LAPTOP: switch.py</text><text x="925.0" y="778" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">reads text, picks action</text><text x="925.0" y="802" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#52606d" text-anchor="middle" font-weight="normal">pyserial + pynput</text><line x1="1056" y1="775" x2="1154" y2="775" stroke="#1f2933" stroke-width="4" stroke-linecap="round"/><polygon points="1154,775 1143.2,780.2 1143.2,769.8" fill="#1f2933"/><text x="1105.0" y="756" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" text-anchor="middle" font-weight="normal">key presses</text><text x="1105.0" y="802" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" text-anchor="middle" font-weight="normal"></text><rect x="1160" y="710" width="250" height="130" rx="10" fill="#eef3f8" stroke="#1f2933" stroke-width="3"/><text x="1285.0" y="746" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">WINDOWS</text><text x="1285.0" y="778" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">Alt+Tab, apps,</text><text x="1285.0" y="802" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#52606d" text-anchor="middle" font-weight="normal">shortcuts, power</text></svg>